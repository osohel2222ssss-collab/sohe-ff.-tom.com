<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOHEL FF TOP</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#080b12;color:#f5f5f5;font-family:Arial,sans-serif}header{padding:28px 16px;text-align:center;background:linear-gradient(135deg,#171717,#30220b);border-bottom:1px solid #9b741f}h1{color:#f5c451;margin:0 0 8px}header p{color:#ddd;margin:0}.wrap{max-width:1050px;margin:25px auto;padding:0 15px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{padding:12px;border-radius:8px;border:1px solid #555;background:#151a24;color:#fff;flex:1;min-width:160px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:#141a25;border:1px solid #343b49;border-radius:13px;overflow:hidden}.card img{width:100%;height:150px;object-fit:cover;background:#222}.body{padding:14px}.tag{color:#f5c451;font-size:12px}.body h3{margin:8px 0}.body p{color:#c4c9d2;line-height:1.45}.download{display:inline-block;background:#d6a638;color:#111;text-decoration:none;padding:10px 14px;border-radius:7px;font-weight:bold}.empty{color:#bbb;text-align:center;padding:30px}.foot{text-align:center;color:#888;padding:30px}
  </style>
</head>
<body>
<header><h1>SOHEL FF TOP</h1><p>Apps, Files & Updates</p></header>
<main class="wrap">
  <div class="tools"><input id="search" placeholder="নাম দিয়ে খুঁজুন..."><select id="category"><option value="">সব ক্যাটাগরি</option><option>Apps</option><option>Games</option><option>Tools</option><option>Other</option></select></div>
  <section id="items" class="grid"><p class="empty">লোড হচ্ছে...</p></section>
</main>
<div class="foot">© SOHEL FF TOP</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(() => {
  const { createClient } = supabase;
  const db = createClient(window.SOHEL_SUPABASE_URL, window.SOHEL_SUPABASE_PUBLISHABLE_KEY);
  const root = document.getElementById('items');
  let rows = [];
  function render(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const cat = document.getElementById('category').value;
    const filtered = rows.filter(x => (!cat || x.category === cat) && (!q || (x.name+' '+x.description).toLowerCase().includes(q)));
    root.innerHTML = '';
    if(!filtered.length){root.innerHTML='<p class="empty">এখনো কোনো ফাইল যোগ করা হয়নি।</p>';return;}
    filtered.forEach(x => {
      const card=document.createElement('article');card.className='card';
      if(x.image_url){const img=document.createElement('img');img.src=x.image_url;img.alt=x.name;img.loading='lazy';card.appendChild(img);}
      const body=document.createElement('div');body.className='body';
      const tag=document.createElement('div');tag.className='tag';tag.textContent=x.category;
      const h=document.createElement('h3');h.textContent=x.name;
      const p=document.createElement('p');p.textContent=x.description;
      body.append(tag,h,p);
      if(x.download_url){const a=document.createElement('a');a.className='download';a.href=x.download_url;a.target='_blank';a.rel='noopener';a.textContent='Download';body.appendChild(a);}
      card.appendChild(body);root.appendChild(card);
    });
  }
  async function load(){const {data,error}=await db.from('site_files').select('*').order('created_at',{ascending:false});if(error){root.textContent='ডেটা লোড হয়নি: '+error.message;return;}rows=data||[];render();}
  document.getElementById('search').addEventListener('input',render);
  document.getElementById('category').addEventListener('change',render);
  load();
})();
</script>
</body></html>
