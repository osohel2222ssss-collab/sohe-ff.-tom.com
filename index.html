<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090414">
<title>SOHEL FF TOP | Premium Download Hub</title>

<style>
*{box-sizing:border-box}
:root{
  --purple:#a855f7;
  --pink:#ec4899;
  --blue:#6d5dfc;
  --bg:#090414;
}
body{
  margin:0;
  color:#fff;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%,#32105a 0%,transparent 45%),
    linear-gradient(145deg,#090414,#100923 55%,#080411);
  min-height:100vh;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background-image:
    radial-gradient(2px 2px at 20% 30%,#d8a5ff 50%,transparent),
    radial-gradient(2px 2px at 70% 60%,#a855f7 50%,transparent),
    radial-gradient(2px 2px at 40% 80%,#fff 50%,transparent);
  background-size:180px 180px;
  animation:stars 12s linear infinite;
}
@keyframes stars{
  from{background-position:0 0}
  to{background-position:180px 180px}
}
header{
  position:sticky;
  top:0;
  z-index:10;
  padding:17px 15px;
  text-align:center;
  background:#100822dd;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #9b4dff66;
  box-shadow:0 5px 25px #8b2bff22;
}
.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
  color:#fff;
  text-shadow:0 0 8px #b45cff,0 0 25px #a855f7;
}
.logo span{color:#d78aff}
header p{margin:7px 0 0;color:#cdb7e8;font-size:13px}
.wrap{max-width:1100px;margin:auto;padding:20px 15px}
.hero{
  min-height:330px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:35px;
  margin:18px 0 30px;
  border:1px solid #a855f766;
  border-radius:25px;
  background:
    radial-gradient(circle at 80% 50%,#7928c744,transparent 35%),
    linear-gradient(120deg,#1a0c30,#100820);
  box-shadow:0 0 35px #8b2bff25,inset 0 0 30px #a855f711;
  overflow:hidden;
  position:relative;
}
.hero:after{
  content:"";
  position:absolute;
  width:250px;height:250px;
  border:1px solid #d18aff55;
  border-radius:50%;
  right:8%;top:35px;
  box-shadow:0 0 25px #a855f755,inset 0 0 25px #a855f733;
  animation:rotate 15s linear infinite;
}
@keyframes rotate{to{transform:rotate(360deg)}}
.hero-content{position:relative;z-index:2;max-width:580px}
.hero small{color:#d99cff;letter-spacing:3px;font-weight:bold}
.hero h1{
  font-size:clamp(35px,7vw,65px);
  line-height:1.05;
  margin:15px 0;
  background:linear-gradient(90deg,#fff,#d69aff,#a855f7);
  -webkit-background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 12px #a855f766);
}
.hero p{color:#d2c1e7;line-height:1.7}
.hero-visual{
  position:relative;z-index:2;
  width:190px;height:190px;
  flex-shrink:0;
  display:grid;place-items:center;
  font-size:95px;
  border-radius:50%;
  background:radial-gradient(circle,#8b32d7,#230b43 65%,transparent 70%);
  filter:drop-shadow(0 0 30px #a855f7);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-15px) rotate(4deg)}
}
.hero-btn{
  display:inline-block;
  margin-top:12px;
  padding:13px 23px;
  color:white;
  text-decoration:none;
  font-weight:bold;
  border-radius:10px;
  background:linear-gradient(100deg,#8b35e9,#d946ef);
  box-shadow:0 0 20px #a855f788;
}
.section-title{
  font-size:23px;
  margin:28px 0 16px;
  color:#e6c5ff;
  text-shadow:0 0 12px #a855f7;
}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
input,select{
  flex:1;min-width:150px;
  padding:14px;
  border-radius:12px;
  border:1px solid #7840a7;
  background:#160c27;
  color:white;
  outline:none;
  font-size:14px;
}
input:focus,select:focus{
  border-color:#d18aff;
  box-shadow:0 0 15px #a855f755;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:20px;
  perspective:1000px;
}
.card{
  background:linear-gradient(145deg,#24113c,#110a20);
  border:1px solid #7036a3;
  border-radius:17px;
  overflow:hidden;
  transform-style:preserve-3d;
  transition:transform .35s,border-color .35s,box-shadow .35s;
  box-shadow:0 8px 22px #0008;
  animation:appear .6s ease both;
}
@keyframes appear{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
.card:hover{
  transform:translateY(-9px) rotateX(3deg) rotateY(-3deg);
  border-color:#d18aff;
  box-shadow:0 15px 35px #a855f755;
}
.card img{
  width:100%;height:165px;
  object-fit:cover;
  background:#20102f;
  border-bottom:1px solid #783ab1;
}
.body{padding:16px}
.tag{
  display:inline-block;
  color:#e3b7ff;
  background:#8b35e933;
  border:1px solid #a855f766;
  border-radius:20px;
  padding:5px 11px;
  font-size:11px;
}
.body h3{margin:12px 0;font-size:18px}
.body p{color:#c9b9dc;line-height:1.6;font-size:14px}
.download{
  display:block;
  text-align:center;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:linear-gradient(100deg,#812ee4,#c026d3);
  color:white;
  font-weight:bold;
  text-decoration:none;
  box-shadow:0 0 15px #a855f755;
  transition:.25s;
}
.download:hover{
  transform:scale(1.04);
  box-shadow:0 0 25px #d946ef;
}
.empty{
  color:#cbb6e2;
  text-align:center;
  padding:30px;
  grid-column:1/-1;
}
.footer{
  margin-top:45px;
  padding:30px 15px;
  text-align:center;
  color:#bba7d1;
  background:#100820;
  border-top:1px solid #7434a7;
}
@media(max-width:650px){
  .hero{padding:25px 18px;min-height:280px}
  .hero-visual{width:100px;height:100px;font-size:55px}
  .hero:after{width:130px;height:130px;right:0;top:65px}
  .logo{font-size:22px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .card img{height:120px}
  .body{padding:11px}
  .body h3{font-size:15px}
  .body p{font-size:12px}
  .download{font-size:12px;padding:10px}
}
@media(max-width:360px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header>
  <div class="logo">👑 SOHEL <span>FF TOP</span></div>
  <p>Premium Apps • Games • Files</p>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hero-content">
      <small>WELCOME TO PREMIUM WORLD</small>
      <h1>SOHEL FF TOP</h1>
      <p>Discover Apps, Games, Tools and Files in one place. Download and enjoy!</p>
      <a href="#downloads" class="hero-btn">🚀 Explore Downloads</a>
    </div>
    <div class="hero-visual">🎮</div>
  </section>

  <h2 class="section-title" id="downloads">✨ Explore Downloads</h2>

  <div class="tools">
    <input id="search" placeholder="🔍 নাম দিয়ে খুঁজুন...">
    <select id="category">
      <option value="">সব ক্যাটাগরি</option>
      <option>Apps</option>
      <option>Games</option>
      <option>Tools</option>
      <option>Other</option>
    </select>
  </div>

  <section id="items" class="grid">
    <p class="empty">লোড হচ্ছে...</p>
  </section>
</main>

<footer class="footer">
  <div>👑 SOHEL FF TOP</div>
  <p>© 2026 SOHEL FF TOP. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
(() => {
  const {createClient}=supabase;
  const db=createClient(
    window.SOHEL_SUPABASE_URL,
    window.SOHEL_SUPABASE_PUBLISHABLE_KEY
  );

  const root=document.getElementById('items');
  let rows=[];

  function render(){
    const q=document.getElementById('search').value.trim().toLowerCase();
    const cat=document.getElementById('category').value;

    const filtered=rows.filter(x=>
      (!cat || x.category===cat) &&
      (!q || ((x.name||'')+' '+(x.description||'')).toLowerCase().includes(q))
    );

    root.innerHTML='';

    if(!filtered.length){
      root.innerHTML='<p class="empty">এখনো কোনো ফাইল যোগ করা হয়নি।</p>';
      return;
    }

    filtered.forEach(x=>{
      const card=document.createElement('article');
      card.className='card';

      if(x.image_url){
        const img=document.createElement('img');
        img.src=x.image_url;
        img.alt=x.name||'File image';
        img.loading='lazy';
        card.appendChild(img);
      }

      const body=document.createElement('div');
      body.className='body';

      const tag=document.createElement('div');
      tag.className='tag';
      tag.textContent=x.category||'Other';

      const h=document.createElement('h3');
      h.textContent=x.name||'Untitled';

      const p=document.createElement('p');
      p.textContent=x.description||'';

      body.append(tag,h,p);

      if(x.download_url){
        const a=document.createElement('a');
        a.className='download';
        a.href=x.download_url;
        a.target='_blank';
        a.rel='noopener noreferrer';
        a.textContent='⬇ Download Now';
        body.appendChild(a);
      }

      card.appendChild(body);
      root.appendChild(card);
    });
  }

  async function load(){
    const {data,error}=await db
      .from('site_files')
      .select('*')
      .order('created_at',{ascending:false});

    if(error){
      root.textContent='ডেটা লোড হয়নি: '+error.message;
      return;
    }

    rows=data||[];
    render();
  }

  document.getElementById('search').addEventListener('input',render);
  document.getElementById('category').addEventListener('change',render);

  load();
})();
</script>
</body>
</html>
